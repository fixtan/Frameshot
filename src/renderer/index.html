<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Frameshot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="toolbar">
    <div class="row">
      <button id="back" title="戻る (Alt+←)">◀</button>
      <button id="forward" title="進む (Alt+→)">▶</button>
      <button id="reload" title="再読み込み (F5)">⟳</button>
      <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="URL を入力して Enter（例: lain-lab.com）">
      <button id="star" title="このページをブックマーク">☆</button>
      <button id="books" title="ブックマーク・最近開いた URL">📚</button>
    </div>

    <div class="row">
      <label class="num">W <input id="w" type="number" min="100" max="16384" step="1"></label>
      <button id="swap" title="幅と高さを入れ替え">⇄</button>
      <label class="num">H <input id="h" type="number" min="100" max="16384" step="1"></label>

      <span id="presetBox" class="group">
        <select id="preset" title="サイズプリセット"></select>
        <button id="presetAdd" title="今のサイズを自分用プリセットに登録">＋</button>
        <button id="presetDel" title="選んでいる自分用プリセットを削除">－</button>
      </span>
      <span id="presetNameBox" class="group" hidden>
        <input id="presetName" type="text" maxlength="40" placeholder="プリセット名（Enter で登録）">
        <button id="presetOk">登録</button>
        <button id="presetCancel" title="キャンセル (Esc)">×</button>
      </span>

      <label>倍率
        <select id="scale">
          <option value="1">1x</option>
          <option value="2">2x</option>
          <option value="3">3x</option>
        </select>
      </label>
      <label>形式
        <select id="format">
          <option value="webp">WebP</option>
          <option value="jpg">JPG</option>
          <option value="png">PNG</option>
        </select>
      </label>
      <label id="qualityBox">画質 <input id="quality" type="number" min="1" max="100" step="1"></label>
      <label id="losslessBox" title="WebP を可逆圧縮にする"><input id="lossless" type="checkbox"> ロスレス</label>
      <label title="保存するとき、クリップボードにもコピーする"><input id="copyToo" type="checkbox"> コピーも</label>

      <span class="spacer"></span>
      <button id="rec" title="録画を開始 (Ctrl+Shift+R)">⏺</button>
      <button id="recOpt" title="動画の設定（フレームレート・画質・最大時間）">▾</button>
      <button id="copy" title="クリップボードにコピー (Ctrl+Shift+C)">📋 コピー</button>
      <button id="shoot" class="primary" title="静止画を保存 (Ctrl+Shift+S)">📷 撮影</button>
    </div>
  </header>

  <!-- 枠の輪郭。枠そのもの（WebContentsView）はこの上に重なる -->
  <div id="outline" hidden></div>

  <footer id="statusbar">
    <span id="status">待機中</span>
    <span id="info"></span>
    <span id="dirBox">
      <span id="dir"></span>
      <button id="openDir" title="保存先を開く">開く</button>
      <button id="chooseDir" title="保存先を変更">変更…</button>
    </span>
  </footer>

  <script src="audio-capture.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
