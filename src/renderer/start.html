<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Frameshot</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0710; color: #e8e0f0;
    font: 14px/1.7 ui-monospace, Menlo, Consolas, "Noto Sans Mono CJK JP", monospace; }
  main { max-width: 560px; margin: 0 auto; padding: 8vh 24px 24px; box-sizing: border-box; }
  h1 { font-size: 22px; margin: 0 0 4px; color: #ff5fa2; letter-spacing: 0.04em; }
  p.lead { margin: 0 0 24px; color: #8a7f99; }
  ol { padding-left: 1.4em; margin: 0 0 24px; }
  li { margin-bottom: 6px; }
  kbd { background: #17101f; border: 1px solid #2a2234; border-radius: 4px; padding: 0 6px; font: inherit; }
  .keys { color: #8a7f99; font-size: 12px; }
  .keys div { margin-bottom: 2px; }
</style>
</head>
<body>
<main>
  <h1>Frameshot</h1>
  <p class="lead">固定サイズの枠で Web ページを撮る。</p>
  <ol>
    <li>上の URL バーにアドレスを入れて Enter</li>
    <li>W × H（または「プリセット…」）で枠の大きさを決める。画面に入らないときは表示だけ縮小され、撮影は実寸</li>
    <li>ページを操作して、撮りたい状態にして <b>📷 撮影</b></li>
  </ol>
  <div class="keys">
    <div><kbd>Ctrl</kbd>+<kbd>L</kbd> URL バー ／ <kbd>F5</kbd> 再読み込み ／ <kbd>Alt</kbd>+<kbd>←</kbd><kbd>→</kbd> 戻る・進む</div>
    <div><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> 撮影して保存 ／ <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd> コピー</div>
    <div><kbd>F12</kbd> このページの開発者ツール</div>
  </div>
</main>
</body>
</html>
