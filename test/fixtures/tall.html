<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Frameshot capture fixture</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: linear-gradient(#ffffff, #cccccc); font: 16px/1.4 sans-serif; }
  /* 四辺に色帯。ビューポートの端が切れていれば、その色が出力に現れない */
  .top    { position: fixed; top: 0;    left: 0; right: 0; height: 20px; background: #ff0000; }
  .bottom { position: fixed; bottom: 0; left: 0; right: 0; height: 20px; background: #0000ff; }
  .right  { position: fixed; top: 0; bottom: 0; right: 0;  width: 20px;  background: #00aa00; }
  .left   { position: fixed; top: 0; bottom: 0; left: 0;   width: 20px;  background: #ffaa00; }
  #info { position: absolute; top: 40px; left: 40px; }
</style>
</head>
<body>
  <div class="top"></div><div class="bottom"></div><div class="left"></div><div class="right"></div>
  <p id="info">fixture</p>
  <script>
    const show = () => { document.getElementById('info').textContent = innerWidth + ' x ' + innerHeight + ' @' + devicePixelRatio + 'x'; };
    addEventListener('resize', show); show();
  </script>
</body>
</html>
